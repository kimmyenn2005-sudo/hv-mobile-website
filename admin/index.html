<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Quản trị website | HV Mobile</title>
  <link rel="icon" type="image/png" href="/hv-mobile-google-192.png">
  <style>
    html,body{font-family:Arial,Helvetica,sans-serif;background:#f6f3e9}
    .cms-loading{max-width:560px;margin:14vh auto;padding:28px;border:1px solid #e2d5ad;border-radius:16px;background:#fff;text-align:center;color:#292929;box-shadow:0 18px 45px rgba(0,0,0,.08)}
    .cms-loading strong{display:block;color:#9a7415;font-size:22px;margin-bottom:8px}
  </style>
</head>
<body>
  <div class="cms-loading">
    <strong>HV Mobile</strong>
    Đang mở quản trị bảng giá & bài viết…
  </div>
  <script src="https://unpkg.com/decap-cms@3.8.3/dist/decap-cms.js"></script>
  <script>
    // Decap CMS có thanh "Nội dung / Tập tin" dạng sticky/fixed che các ô nhập khi cuộn.
    // Chỉ chuyển đúng thanh này về vị trí bình thường; không ẩn nút và không ảnh hưởng chức năng CMS.
    (() => {
      const normalize = (value) => String(value || '').replace(/\s+/g, ' ').trim();
      const fixFloatingCmsNav = () => {
        document.querySelectorAll('body *').forEach((el) => {
          const style = getComputedStyle(el);
          if (style.position !== 'fixed' && style.position !== 'sticky') return;
          const text = normalize(el.innerText);
          if (!text.includes('Nội dung') || !text.includes('Tập tin')) return;
          if (text.length > 220) return;
          el.style.setProperty('position', 'static', 'important');
          el.style.setProperty('top', 'auto', 'important');
          el.style.setProperty('left', 'auto', 'important');
          el.style.setProperty('right', 'auto', 'important');
          el.style.setProperty('width', 'auto', 'important');
          el.style.setProperty('z-index', '2', 'important');
          el.style.setProperty('box-shadow', 'none', 'important');
          el.dataset.hvCmsNavFixed = '1';
        });
      };
      const observer = new MutationObserver(() => requestAnimationFrame(fixFloatingCmsNav));
      observer.observe(document.documentElement, { childList: true, subtree: true });
      window.addEventListener('load', fixFloatingCmsNav);
      window.addEventListener('scroll', fixFloatingCmsNav, { passive: true });
      setTimeout(fixFloatingCmsNav, 600);
      setTimeout(fixFloatingCmsNav, 1800);
    })();
  </script>
</body>
</html>
